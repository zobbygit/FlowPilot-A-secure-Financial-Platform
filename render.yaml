# Render Blueprint (New + > Blueprint). Render builds backend/Dockerfile on ITS servers; nothing to install locally.
# Values marked sync:false are typed into the Render dashboard (they are secrets or depend on your domains).
services:
  - type: web
    name: flowpilot-api
    runtime: docker
    plan: free                      # free = 512 MB RAM and sleeps when idle (first request after sleep takes ~1 minute). Use "starter" for always-on.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - { key: SPRING_PROFILES_ACTIVE, value: prod }
      - { key: FLOWPILOT_COOKIE_SECURE, value: "true" }
      - { key: DB_POOL_SIZE, value: "5" }
      - { key: BREVO_SENDER_NAME, value: FlowPilot }
      # Database (Neon) - see docs/DEPLOY_RENDER_VERCEL.md for how to convert the Neon string
      - { key: DATABASE_URL, sync: false }
      - { key: DATABASE_USERNAME, sync: false }
      - { key: DATABASE_PASSWORD, sync: false }
      # Your frontend
      - { key: FLOWPILOT_PUBLIC_BASE_URL, sync: false }
      - { key: FLOWPILOT_CORS_ALLOWED_ORIGINS, sync: false }
      - { key: FLOWPILOT_COOKIE_SAMESITE, sync: false }
      # Email (Brevo) and files (Cloudinary)
      - { key: BREVO_API_KEY, sync: false }
      - { key: BREVO_SENDER_EMAIL, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      # First admin (remove both after the first successful start)
      - { key: FLOWPILOT_ADMIN_BOOTSTRAP_EMAIL, sync: false }
      - { key: FLOWPILOT_ADMIN_BOOTSTRAP_PASSWORD, sync: false }