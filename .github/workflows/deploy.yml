name: Deploy
# Deploys only after CI passed on main. Render (backend) and Vercel (frontend) both auto-deploy from Git by
# default; this workflow instead triggers Render via a deploy hook so a red CI run can never ship.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  render:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env: { RENDER_DEPLOY_HOOK_URL: '${{ secrets.RENDER_DEPLOY_HOOK_URL }}' }
